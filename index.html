```html
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDR センサーテスト</title>
</head>
<body>

<h2>PDR センサーテスト</h2>

<button id="startButton">センサーテスト開始</button>
<button onclick="stopSensor()">計測終了</button>

<h3>向き</h3>
<p id="heading">0°</p>

<h3>加速度</h3>
<p>加速度：<span id="acceleration">0</span></p>

<h3>歩数</h3>
<p>歩数：<span id="stepCount">0</span></p>

<h3>現在位置と推定距離</h3>
<p id="position">方式A・Bの位置は計測開始後に表示されます。</p>

<h3>実測距離</h3>
<label for="actualDistance">歩いた距離（m）：</label>
<input
    type="number"
    id="actualDistance"
    value="10"
    min="0.01"
    step="0.01"
>
<button onclick="saveTrial()">データをCSV保存</button>

<h3>歩行軌跡</h3>
<p>青：方式A、赤：方式B</p>
<canvas
    id="map"
    width="800"
    height="800"
    style="border:1px solid black; max-width:100%; height:auto;"
></canvas>

<script src="script.js"></script>

</body>
</html>
```
