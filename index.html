<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>PDR センサーテスト</title>
</head>

<body>

<h2>PDR センサーテスト</h2>

<button onclick="requestPermission()">センサテスト開始</button>

<h3>向き</h3>
<p id="heading">未開始</p>

<h3>加速度</h3>
<p>X：<span id="accX">0</span></p>
<p>Y：<span id="accY">0</span></p>
<p>Z：<span id="accZ">0</span></p>

<h3>歩数</h3>
<p>合成加速度：<span id="magnitude">0</span></p>
<p>歩数：<span id="step">0</span></p>

<h3>現在位置</h3>
<p>X：<span id="posX">0.00</span> m</p>
<p>Y：<span id="posY">0.00</span> m</p>

<h3>目的地</h3>

<p>X：<span id="targetX">2.00</span> m</p>
<p>Y：<span id="targetY">2.00</span> m</p>

<h3>歩行データ</h3>

<table border="1">
    <thead>
        <tr>
            <th>歩数</th>
            <th>歩行周期(s)</th>
            <th>周波数(Hz)</th>
            <th>最大加速度</th>
            <th>最小加速度</th>
            <th>変化量</th>
        </tr>
    </thead>

    <tbody id="stepTable">
    </tbody>
</table>

<h3>10歩の実距離</h3>

<input
    type="number"
    id="actualDistance"
    step="0.01"
    placeholder="例：6.80">

<span>m</span>

<button onclick="saveTrial()">10歩のデータを保存</button>

<h3>歩行軌跡</h3>

<canvas
    id="map"
    width="800"
    height="800"
    style="border:1px solid black;">
</canvas>

<script src="script.js"></script>


</body>
</html>
